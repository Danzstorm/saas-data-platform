[project]
name = "saas-data-platform"
version = "0.1.0"
description = "SAAS multi-tenant medallion data platform (Bronze/Silver/Gold) on PySpark + Delta Lake"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Daniel Santos", email = "daniel.santos.emprende@gmail.com" }]
license = { text = "MIT" }

dependencies = [
    "pyspark==3.5.3",
    "delta-spark==3.2.1",
    "omegaconf>=2.3.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "databricks-sdk>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "pyyaml>=6.0",
]

[project.scripts]
saas-pipeline = "saas_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saas_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "spark-warehouse", "mentoring/bad_code.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
# E501: line length handled by formatter, not lint.
# N812: PySpark community convention is `from pyspark.sql import functions as F`.
#       Renaming it would diverge from every Spark example out there.
ignore = ["E501", "N812"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/saas_pipeline"]
